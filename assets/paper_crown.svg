<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2363A" />
      <stop offset="50%" stop-color="#991B1E" />
      <stop offset="100%" stop-color="#6F1114" />
    </linearGradient>
    <linearGradient id="foldGrad1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E24B50" />
      <stop offset="100%" stop-color="#A52327" />
    </linearGradient>
    <linearGradient id="foldGrad2" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801518" />
      <stop offset="100%" stop-color="#550D10" />
    </linearGradient>
    <filter id="crownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#crownShadow)">
    <!-- Base crown fold -->
    <polygon points="12,74 88,74 80,82 20,82" fill="#580D10" />
    <!-- Main Crown Peaks -->
    <!-- Left peak -->
    <polygon points="12,74 50,74 30,30" fill="url(#foldGrad1)" />
    <!-- Right peak -->
    <polygon points="50,74 88,74 70,30" fill="url(#foldGrad2)" />
    <!-- Center front peak -->
    <polygon points="26,74 74,74 50,18" fill="url(#crownGrad)" />
    <!-- Fold highlight creases -->
    <polygon points="50,18 50,74 26,74" fill="#E8585D" opacity="0.35" />
    <polygon points="30,30 50,74 12,74" fill="#FF7B80" opacity="0.2" />
    <polygon points="70,30 88,74 50,74" fill="#000000" opacity="0.25" />
    <!-- Small jewel / gem accents -->
    <circle cx="50" cy="22" r="3" fill="#FFF5EA" opacity="0.9" />
    <circle cx="30" cy="33" r="2.5" fill="#FFF5EA" opacity="0.8" />
    <circle cx="70" cy="33" r="2.5" fill="#FFF5EA" opacity="0.8" />
  </g>
</svg>
